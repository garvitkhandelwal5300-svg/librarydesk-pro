
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LibraryDesk Pro</title><style>
:root{--b:#5b5ce2;--g:#16a34a;--r:#dc2626;--bg:#f5f7fb;--card:#fff;--line:#e6eaf1;--ink:#182033}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}
nav{background:#11182b;color:#fff;padding:14px max(18px,calc((100vw - 1180px)/2));display:flex;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:900;margin-right:auto}.brand span{color:#aab5ff}.navlink{padding:8px 10px;color:#c9d0df}.wrap{max-width:1180px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:10px 14px;background:var(--b);color:#fff;font-weight:750;cursor:pointer}.secondary{background:#eef0ff;color:#4f46e5}.danger{background:#fee2e2;color:#b91c1c}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stat small{color:#718096}.stat b{display:block;font-size:25px;margin-top:6px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:11px;color:#718096;text-transform:uppercase}.scroll{overflow:auto}.badge{padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.dot.g{background:#22c55e}.dot.r{background:#ef4444}.actions{display:flex;gap:6px;flex-wrap:wrap}.flash{padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;margin-bottom:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:750}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:5px;font:inherit}textarea{min-height:75px}.wide{grid-column:1/-1}.avatar{width:90px;height:90px;border-radius:18px;object-fit:cover;background:#eef0ff}.profile{display:grid;grid-template-columns:1fr 1fr;gap:18px}.muted{color:#718096}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.profile{grid-template-columns:1fr}.wrap{padding:16px}.navlink{font-size:13px}}
</style></head><body>
<nav><a class="brand" href="{{ url_for('dashboard') if owner and owner['business_type']!='Admin' else url_for('admin') }}">📚 Library<span>Desk Pro</span></a>
{% if owner %}{% if owner['business_type']=='Admin' %}<a class="navlink" href="/admin">Admin Panel</a>{% else %}<a class="navlink" href="/dashboard">Dashboard</a><a class="navlink" href="/student/add">Add Student</a><a class="navlink" href="/history">Payment History</a>{% endif %}<a class="navlink" href="/logout">Logout</a>{% endif %}</nav>
<main class="wrap">{% with m=get_flashed_messages() %}{% if m %}{% for x in m %}<div class="flash">{{x}}</div>{% endfor %}{% endif %}{% endwith %}{% block body %}{% endblock %}</main></body></html>


{% extends "base.html" %}{% block body %}<h1>Payment History</h1><div class="card"><div class="scroll"><table><thead><tr><th>Date</th><th>Student</th><th>Amount</th><th>Mode</th><th>Note</th></tr></thead><tbody>{% for p in rows %}<tr><td>{{p['paid_on']}}</td><td>{{p['name'] or 'Removed Student'}}</td><td>₹{{'%.0f'|format(p['amount'])}}</td><td><span class="badge {{'green' if p['mode']=='Cash' else 'secondary'}}">{{p['mode']}}</span></td><td>{{p['note']}}</td></tr>{% else %}<tr><td colspan="5">No payments recorded.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
